# FileMaker OData Webhooks Manager
server {
    listen 8081;
    server_name localhost;
    root /Volumes/DATA00/wwwroot/fmwebhooks;
    
    # Proxy FileMaker API requests
    location /api/filemaker/ {
        proxy_pass https://192.168.0.24/;
        proxy_ssl_verify off;
        proxy_set_header Host 192.168.0.24;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve static assets from /assets/
    location /assets/ {
        alias /Volumes/DATA00/wwwroot/fmwebhooks/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main location - serve React app from root
    location / {
        try_files $uri $uri/ /index.html;
    }
}
