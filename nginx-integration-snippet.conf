# Add this location block inside your existing server { ... } block
# Place it before the existing location / { ... } block

# Proxy FileMaker OData API to avoid CORS
location /fmi/ {
    proxy_pass https://192.168.0.24/fmi/;
    proxy_ssl_verify off;  # Important: Accept self-signed certificates
    proxy_ssl_trusted_certificate /dev/null;  # Ignore certificate chain
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Handle CORS headers
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}

# Then update your existing location / block to this:
location / {
    root /Volumes/DATA00/wwwroot;
    index index.html index.php;
    try_files $uri $uri/ /index.html;  # Changed to support SPA routing
}
